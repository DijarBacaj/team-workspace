[project]
name = "team-workspace-api"
version = "0.1.0"
description = "REST API for the Team Workspace application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
team-workspace-seed = "team_workspace.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_workspace"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
source = ["team_workspace"]
omit = ["src/team_workspace/seed.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff.lint]
extend-select = ["I"]
