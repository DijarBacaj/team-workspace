name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: team_workspace_test
          POSTGRES_USER: team_workspace
          POSTGRES_PASSWORD: team_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U team_workspace -d team_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://team_workspace:team_workspace@localhost:5432/team_workspace_test
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Check PostgreSQL schema
        run: uv run python scripts/check_database.py

      - name: Run tests
        run: uv run pytest --cov=team_workspace --cov-report=term-missing
